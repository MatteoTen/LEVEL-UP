<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Solo Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #e0e0ff;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* ── TOP BAR ── */
  .system-alert {
    width: 100%;
    background: linear-gradient(90deg, #1a1a2e, #16213e);
    border-bottom: 1px solid #4444aa;
    padding: 10px 20px;
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: #aaaaff;
  }
  .system-alert span { margin: 0 10px; }
  /* ── NAV ── */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 480px;
    padding: 12px 16px;
    font-size: 0.8rem;
    color: #6666cc;
  }
  .nav button {
    background: none;
    border: 1px solid #333366;
    color: #8888cc;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.75rem;
  }
  .nav button:hover { border-color: #6666cc; color: #aaaaff; }
  /* ── MAIN CARD ── */
  .card {
    width: 100%;
    max-width: 480px;
    background: #0e0e1a;
    border: 1px solid #222244;
    border-radius: 12px;
    padding: 20px;
    margin: 8px 16px;
  }
  .card h2 {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: #5555aa;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  /* ── STATS HEADER ── */
  .stats-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .stats-header h2 { margin: 0; }
  .reset-btn {
    background: none;
    border: 1px solid #442244;
    color: #aa66aa;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.7rem;
  }
  .reset-btn:hover { border-color: #aa44aa; color: #ffaaff; }
  /* ── RADAR WRAP ── */
  .radar-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 8px 0 24px;
  }
  /* ── STAT BARS ── */
  .stat-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
  }
  .stat-name {
    width: 110px;
    font-size: 0.78rem;
    color: #8888cc;
  }
  .bar-bg {
    flex: 1;
    height: 6px;
    background: #1a1a30;
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s;
  }
  .stat-val {
    width: 30px;
    text-align: right;
    font-size: 0.78rem;
    color: #6666aa;
  }
  /* ── SHOP ── */
  .shop-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .shop-header h2 { margin: 0; }
  .refresh-btn {
    background: none;
    border: 1px solid #224422;
    color: #66aa66;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.7rem;
  }
  .refresh-btn:hover { border-color: #44aa44; color: #aaffaa; }
  .shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #0a0a18;
    border: 1px solid #1a1a33;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .item-name { font-size: 0.82rem; color: #ccccff; }
  .item-cost { font-size: 0.78rem; color: #aaaa55; }
  .buy-btn {
    background: #1a1a44;
    border: 1px solid #3333aa;
    color: #8888ff;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.72rem;
  }
  .buy-btn:hover { background: #222266; color: #aaaaff; }
</style>
</head>
<body>
<!-- ── TOP BAR ── -->
<div class="system-alert">
  ☆ <span>LV: 1</span>
  <span>⚡ EXP: 0 / 10</span>
  <span>🪙 50</span>
  <span>💚 100</span>
</div>
<!-- ── NAV ── -->
<div class="nav">
  <button>← INDIETRO</button>
  <span>1. STATS &amp; SHOP</span>
  <button>AVANTI →</button>
</div>
<!-- ── STATS CARD ── -->
<div class="card">
  <div class="stats-header">
    <h2>Statistiche</h2>
    <button class="reset-btn">RESETTA</button>
  </div>
  <!-- RADAR SVG: il viewBox è sovradimensionato per dare spazio alle label esterne -->
  <div class="radar-wrap">
    <svg id="radarSvg"
         width="300" height="300"
         viewBox="0 0 300 300"
         xmlns="[w3.org](http://www.w3.org/2000/svg)">
    </svg>
  </div>
  <!-- BARRE STAT -->
  <div id="statBars"></div>
</div>
<!-- ── SHOP CARD ── -->
<div class="card">
  <div class="shop-header">
    <h2>Negozio di Sistema</h2>
    <button class="refresh-btn">AGGIORNA</button>
  </div>
  <div id="shopItems">
    <div class="shop-item">
      <span class="item-name">Pozione Forza</span>
      <span class="item-cost">🪙 30</span>
      <button class="buy-btn">ACQUISTA</button>
    </div>
    <div class="shop-item">
      <span class="item-name">Libro di Saggezza</span>
      <span class="item-cost">🪙 50</span>
      <button class="buy-btn">ACQUISTA</button>
    </div>
    <div class="shop-item">
      <span class="item-name">Kit Artistico</span>
      <span class="item-cost">🪙 40</span>
      <button class="buy-btn">ACQUISTA</button>
    </div>
  </div>
</div>
<script>
// ─────────────────────────────────────────────
// CONFIGURAZIONE
// ─────────────────────────────────────────────
const STATS = [
  { name: 'FORZA',        icon: '⚔️',  value: 30, color: '#ff6666' },
  { name: 'INTELLIGENZA', icon: '📖',  value: 60, color: '#6699ff' },
  { name: 'ARTE',         icon: '🎨',  value: 45, color: '#cc66ff' },
];
const MAX_VAL = 100;
// Centro e raggi del grafico (coordinate SVG, viewBox 300×300)
const CX = 150;
const CY = 150;
const R_GRID  = 85;   // raggio massimo del grid
const R_DOT   = 20;   // distanza extra per i puntini sui vertici del grid
const R_LABEL = 118;  // raggio per il centro dell'icona+testo (fuori dal grid)
// ─────────────────────────────────────────────
// UTILITY: coordinate di un vertice del poligono
// Il primo asse punta verso l'ALTO (−90°), poi
// procede in senso orario.
// ─────────────────────────────────────────────
function vertex(index, total, radius) {
  const angle = (2 * Math.PI * index) / total - Math.PI / 2;
  return {
    x: CX + radius * Math.cos(angle),
    y: CY + radius * Math.sin(angle),
  };
}
// ─────────────────────────────────────────────
// COSTRUZIONE RADAR
// ─────────────────────────────────────────────
function buildRadar() {
  const svg = document.getElementById('radarSvg');
  const NS  = '[w3.org](http://www.w3.org/2000/svg)';
  const N   = STATS.length; // 3 assi
  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  }
  // ── 1. Anelli del grid (3 livelli) ──────────────────────────────────────
  [1/3, 2/3, 1].forEach(t => {
    const pts = STATS.map((_, i) => {
      const p = vertex(i, N, R_GRID * t);
      return `${p.x},${p.y}`;
    }).join(' ');
    svg.appendChild(el('polygon', {
      points: pts,
      fill: 'none',
      stroke: '#222255',
      'stroke-width': '1',
    }));
  });
  // ── 2. Linee degli assi (centro → vertice) ──────────────────────────────
  STATS.forEach((_, i) => {
    const p = vertex(i, N, R_GRID);
    svg.appendChild(el('line', {
      x1: CX, y1: CY, x2: p.x, y2: p.y,
      stroke: '#222255',
      'stroke-width': '1',
    }));
  });
  // ── 3. Poligono dei dati ─────────────────────────────────────────────────
  const dataPts = STATS.map((s, i) => {
    const r = (s.value / MAX_VAL) * R_GRID;
    const p = vertex(i, N, r);
    return `${p.x},${p.y}`;
  }).join(' ');
  svg.appendChild(el('polygon', {
    points: dataPts,
    fill: 'rgba(100,100,255,0.18)',
    stroke: '#6666ff',
    'stroke-width': '2',
  }));
  // ── 4. Pallini sui vertici del grid ─────────────────────────────────────
  STATS.forEach((_, i) => {
    const p = vertex(i, N, R_GRID);
    svg.appendChild(el('circle', {
      cx: p.x, cy: p.y, r: '3',
      fill: '#444488',
    }));
  });
  // ── 5. Pallini sui valori ────────────────────────────────────────────────
  STATS.forEach((s, i) => {
    const r = (s.value / MAX_VAL) * R_GRID;
    const p = vertex(i, N, r);
    svg.appendChild(el('circle', {
      cx: p.x, cy: p.y, r: '4',
      fill: s.color,
    }));
  });
  // ── 6. Icone + nomi CENTRATI sull'angolo esterno ─────────────────────────
  //
  // Strategia: ogni label è un <g> con:
  //   • un <text> per l'emoji (icona)  → dy = -8  (sopra il centro)
  //   • un <text> per il nome stat     → dy = +10 (sotto il centro)
  // Il <g> è traslato esattamente sul punto vertex(i, N, R_LABEL),
  // che coincide con la proiezione dell'angolo verso l'esterno.
  // text-anchor="middle" + dominant-baseline="middle" garantiscono
  // la centratura sia orizzontale sia verticale rispetto al punto.
  //
  STATS.forEach((s, i) => {
    const p = vertex(i, N, R_LABEL);
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', `translate(${p.x}, ${p.y})`);
    // Icona emoji
    const iconText = document.createElementNS(NS, 'text');
    iconText.setAttribute('text-anchor', 'middle');
    iconText.setAttribute('dominant-baseline', 'middle');
    iconText.setAttribute('dy', '-9');
    iconText.setAttribute('font-size', '16');
    iconText.textContent = s.icon;
    // Nome statistica
    const nameText = document.createElementNS(NS, 'text');
    nameText.setAttribute('text-anchor', 'middle');
    nameText.setAttribute('dominant-baseline', 'middle');
    nameText.setAttribute('dy', '9');
    nameText.setAttribute('font-size', '10');
    nameText.setAttribute('fill', '#8888cc');
    nameText.setAttribute('font-family', 'Segoe UI, sans-serif');
    nameText.setAttribute('letter-spacing', '0.08em');
    nameText.textContent = s.name;
    g.appendChild(iconText);
    g.appendChild(nameText);
    svg.appendChild(g);
  });
}
// ─────────────────────────────────────────────
// BARRE DELLE STATISTICHE
// ─────────────────────────────────────────────
function buildBars() {
  const container = document.getElementById('statBars');
  container.innerHTML = '';
  STATS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `
      <span class="stat-name">${s.icon} ${s.name}</span>
      <div class="bar-bg">
        <div class="bar-fill"
             style="width:${s.value}%;
                    background: linear-gradient(90deg, ${s.color}66, ${s.color});">
        </div>
      </div>
      <span class="stat-val">${s.value}</span>`;
    container.appendChild(row);
  });
}
// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
buildRadar();
buildBars();
</script>
</body>
</html>
