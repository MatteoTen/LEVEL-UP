<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Solo Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    color: #e0e0ff;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── TOP BAR ── */
  .system-alert {
    width: 100%;
    background: linear-gradient(90deg, #1a1a2e, #16213e);
    border-bottom: 1px solid #4444aa;
    padding: 10px 20px;
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: #aaaaff;
  }
  .system-alert span { margin: 0 10px; }

  /* ── NAV ── */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 480px;
    padding: 12px 16px;
    font-size: 0.8rem;
    color: #6666cc;
  }
  .nav button {
    background: none;
    border: 1px solid #333366;
    color: #8888cc;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.75rem;
  }
  .nav button:hover { border-color: #6666cc; color: #aaaaff; }

  /* ── MAIN CARD ── */
  .card {
    width: 100%;
    max-width: 480px;
    background: #0e0e1a;
    border: 1px solid #222244;
    border-radius: 12px;
    padding: 20px;
    margin: 8px 16px;
  }
  .card h2 {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: #5555aa;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* ── STATS ── */
  .stats-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .stats-header h2 { margin: 0; }
  .reset-btn {
    background: none;
    border: 1px solid #442244;
    color: #aa66aa;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.7rem;
  }
  .reset-btn:hover { border-color: #aa44aa; color: #ffaaff; }

  /* ── RADAR CHART ── */
  .radar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 8px 0 20px;
  }

  .radar-labels {
    position: relative;
    width: 260px;
    height: 260px;
  }

  .radar-labels svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: visible;
  }

  .axis-label {
    position: absolute;
    font-size: 0.72rem;
    color: #8888cc;
    white-space: nowrap;
    transform: translate(-50%, -50%);
  }

  /* ── STAT BARS ── */
  .stat-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
  }
  .stat-name {
    width: 100px;
    font-size: 0.78rem;
    color: #8888cc;
  }
  .bar-bg {
    flex: 1;
    height: 6px;
    background: #1a1a30;
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #4444cc, #8888ff);
    transition: width 0.4s;
  }
  .stat-val {
    width: 30px;
    text-align: right;
    font-size: 0.78rem;
    color: #6666aa;
  }

  /* ── SHOP ── */
  .shop-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .shop-header h2 { margin: 0; }
  .refresh-btn {
    background: none;
    border: 1px solid #224422;
    color: #66aa66;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.7rem;
  }
  .refresh-btn:hover { border-color: #44aa44; color: #aaffaa; }

  .shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #0a0a18;
    border: 1px solid #1a1a33;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .item-name { font-size: 0.82rem; color: #ccccff; }
  .item-cost { font-size: 0.78rem; color: #aaaa55; }
  .buy-btn {
    background: #1a1a44;
    border: 1px solid #3333aa;
    color: #8888ff;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.72rem;
  }
  .buy-btn:hover { background: #222266; color: #aaaaff; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="system-alert">
  ☆ <span>LV: 1</span>
  <span>⚡ EXP: 0 / 10</span>
  <span>🪙 50</span>
  <span>💚 100</span>
</div>

<!-- NAV -->
<div class="nav">
  <button>← INDIETRO</button>
  <span>1. STATS &amp; SHOP</span>
  <button>AVANTI →</button>
</div>

<!-- STATS CARD -->
<div class="card">
  <div class="stats-header">
    <h2>Statistiche</h2>
    <button class="reset-btn">RESETTA</button>
  </div>

  <!-- RADAR -->
  <div class="radar-wrap">
    <div class="radar-labels" id="radarContainer">
      <svg id="radarSvg" viewBox="0 0 260 260"></svg>
    </div>
  </div>

  <!-- BARS -->
  <div id="statBars"></div>
</div>

<!-- SHOP CARD -->
<div class="card">
  <div class="shop-header">
    <h2>Negozio di Sistema</h2>
    <button class="refresh-btn">AGGIORNA</button>
  </div>
  <div id="shopItems">
    <div class="shop-item">
      <span class="item-name">Pozione Forza</span>
      <span class="item-cost">🪙 30</span>
      <button class="buy-btn">ACQUISTA</button>
    </div>
    <div class="shop-item">
      <span class="item-name">Libro di Saggezza</span>
      <span class="item-cost">🪙 50</span>
      <button class="buy-btn">ACQUISTA</button>
    </div>
    <div class="shop-item">
      <span class="item-name">Kit Artistico</span>
      <span class="item-cost">🪙 40</span>
      <button class="buy-btn">ACQUISTA</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const STATS = [
  { name: 'FORZA',        value: 30, color: '#ff6666' },
  { name: 'INTELLIGENZA', value: 60, color: '#6699ff' },
  { name: 'ARTE',         value: 45, color: '#cc66ff' },
];
const MAX_VAL = 100;

// ── RADAR ────────────────────────────────────────────────────────────────────
// SVG viewBox is 260×260; centre = (130,130)
// We use a slightly smaller radius so labels fit inside the container.
const CX = 130, CY = 130;
const R_GRID  = 90;   // max grid radius
const R_LABEL = 112;  // label anchor radius (beyond grid)
const AXES    = STATS.length; // 3

/**
 * Return (x, y) for axis i of n, starting straight UP (−90°),
 * going clockwise. This gives:
 *   i=0 → top (FORZA)
 *   i=1 → bottom-right (INTELLIGENZA)
 *   i=2 → bottom-left (ARTE)
 */
function axisPoint(i, n, r) {
  const angle = (2 * Math.PI * i) / n - Math.PI / 2;
  return {
    x: CX + r * Math.cos(angle),
    y: CY + r * Math.sin(angle),
  };
}

function buildRadar() {
  const svg = document.getElementById('radarSvg');
  svg.innerHTML = '';

  const ns = '[w3.org](http://www.w3.org/2000/svg)';

  // ── grid rings (3 levels) ──
  [0.33, 0.66, 1].forEach(t => {
    const pts = STATS.map((_, i) => {
      const p = axisPoint(i, AXES, R_GRID * t);
      return `${p.x},${p.y}`;
    }).join(' ');

    const poly = document.createElementNS(ns, 'polygon');
    poly.setAttribute('points', pts);
    poly.setAttribute('fill', 'none');
    poly.setAttribute('stroke', '#222244');
    poly.setAttribute('stroke-width', '1');
    svg.appendChild(poly);
  });

  // ── axis lines ──
  STATS.forEach((_, i) => {
    const p = axisPoint(i, AXES, R_GRID);
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', CX); line.setAttribute('y1', CY);
    line.setAttribute('x2', p.x); line.setAttribute('y2', p.y);
    line.setAttribute('stroke', '#222244');
    line.setAttribute('stroke-width', '1');
    svg.appendChild(line);
  });

  // ── data polygon ──
  const dataPts = STATS.map((s, i) => {
    const r = (s.value / MAX_VAL) * R_GRID;
    const p = axisPoint(i, AXES, r);
    return `${p.x},${p.y}`;
  }).join(' ');

  const dataPoly = document.createElementNS(ns, 'polygon');
  dataPoly.setAttribute('points', dataPts);
  dataPoly.setAttribute('fill', 'rgba(100,100,255,0.18)');
  dataPoly.setAttribute('stroke', '#6666ff');
  dataPoly.setAttribute('stroke-width', '2');
  svg.appendChild(dataPoly);

  // ── data dots ──
  STATS.forEach((s, i) => {
    const r = (s.value / MAX_VAL) * R_GRID;
    const p = axisPoint(i, AXES, r);
    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', p.x);
    circle.setAttribute('cy', p.y);
    circle.setAttribute('r', '4');
    circle.setAttribute('fill', s.color);
    svg.appendChild(circle);
  });

  // ── axis tip dots ──
  STATS.forEach((_, i) => {
    const p = axisPoint(i, AXES, R_GRID);
    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', p.x);
    dot.setAttribute('cy', p.y);
    dot.setAttribute('r', '3');
    dot.setAttribute('fill', '#444488');
    svg.appendChild(dot);
  });

  // ── labels (SVG text so they share the same coordinate system) ──
  STATS.forEach((s, i) => {
    const p = axisPoint(i, AXES, R_LABEL);
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', p.x);
    text.setAttribute('y', p.y);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('fill', '#8888cc');
    text.setAttribute('font-size', '11');
    text.setAttribute('font-family', 'Segoe UI, sans-serif');
    text.textContent = s.name;
    svg.appendChild(text);
  });
}

// ── BARS ─────────────────────────────────────────────────────────────────────
function buildBars() {
  const container = document.getElementById('statBars');
  container.innerHTML = '';
  STATS.forEach(s => {
    container.innerHTML += `
      <div class="stat-row">
        <span class="stat-name">${s.name}</span>
        <div class="bar-bg">
          <div class="bar-fill" style="width:${s.value}%; background: linear-gradient(90deg, ${s.color}88, ${s.color});"></div>
        </div>
        <span class="stat-val">${s.value}</span>
      </div>`;
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildRadar();
buildBars();
</script>
</body>
</html>
